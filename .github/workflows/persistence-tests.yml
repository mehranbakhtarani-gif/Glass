name: Persistence contract and browser tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  indexeddb-persistence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/indexeddb-persistence.test.cjs
  chromium-indexeddb-fault-injection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-browser persistence test
        run: node --test tests/indexeddb-browser.test.cjs
      - name: Run three-device client sync test
        run: node --test tests/three-device-client-sync.test.cjs

  postgres-concurrent-device-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run concurrent operation transaction tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/glass_test
        run: bash tests/postgres-concurrency.test.sh
